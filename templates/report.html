{% extends "base.html" %}

{% block title %}Report a trail{% endblock %}

{% block content %}
    <h2>Report a trail</h2>

    <form method="post" action="{% url 'report' %}">
        {% csrf_token %}
        <p>
            <label for="name">Your name</label>
            <input type="text" id="name" name="name" required>
        </p>
        <p>
            <label for="email">Your email</label>
            <input type="email" id="email" name="email" required>
        </p>
        <p>
            <label for="trail">Trail name</label>
            <input type="text" id="trail" name="trail" required>
        </p>
        <p>
            <label for="note">What did you find?</label>
            <textarea id="note" name="note" rows="4" required></textarea>
        </p>
        <button type="submit">Send report</button>
    </form>
{% endblock %}
