{% extends "base.html" %}

{% block title %}Thank you{% endblock %}

{% block content %}
    <h2>Thank you, {{ name }}.</h2>

    <p>Your report on <strong>{{ trail }}</strong> has been received.</p>
    <blockquote>{{ note }}</blockquote>
    <p>We will reply to {{ email }} if we need more detail.</p>
{% endblock %}
